<!-- 
SEO & METADATA ENHANCEMENTS
Add these to the <head> section of each page for better SEO
-->

<!-- Open Graph Meta Tags (Social Media Sharing) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://yoursite.com">
<meta property="og:title" content="My Portfolio - Student Showcase">
<meta property="og:description" content="Explore my portfolio of projects, skills, and creative work">
<meta property="og:image" content="https://yoursite.com/assets/og-image.jpg">
<meta property="og:site_name" content="My Portfolio">

<!-- Twitter Card Meta Tags -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://yoursite.com">
<meta property="twitter:title" content="My Portfolio - Student Showcase">
<meta property="twitter:description" content="Explore my portfolio of projects, skills, and creative work">
<meta property="twitter:image" content="https://yoursite.com/assets/twitter-card.jpg">

<!-- Schema.org Structured Data (JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Your Name",
  "url": "https://yoursite.com",
  "email": "your.email@example.com",
  "jobTitle": "Student",
  "image": "https://yoursite.com/assets/profile.jpg",
  "sameAs": [
    "https://linkedin.com/in/yourprofile",
    "https://github.com/yourprofile",
    "https://twitter.com/yourprofile"
  ],
  "mainEntity": {
    "@type": "WebSite",
    "url": "https://yoursite.com",
    "name": "My Portfolio"
  }
}
</script>

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<!-- Preconnect to External Resources -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Canonical URL (helps prevent duplicate content) -->
<link rel="canonical" href="https://yoursite.com">

<!-- Language Declaration -->
<html lang="en">
